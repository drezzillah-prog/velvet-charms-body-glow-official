name: Prelaunch Integrity

on:
  push:
    branches:
      - codex/paypal-cart-safe-20260818
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
